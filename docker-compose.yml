services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lostdog_app
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: lostdog
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lostdog_app -d lostdog"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
